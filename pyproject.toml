[project]
name = "ladepulse-platform"
version = "0.1.0"
description = "Backend and ingestion services for LadePulse DE"
requires-python = ">=3.13,<3.14"
dependencies = [
  "alembic>=1.16,<2",
  "asyncpg>=0.30,<1",
  "boto3>=1.39,<2",
  "fastapi>=0.116,<1",
  "geoalchemy2>=0.18,<1",
  "httpx>=0.28,<1",
  "orjson>=3.11,<4",
  "psycopg[binary]>=3.2,<4",
  "pydantic-settings>=2.10,<3",
  "redis>=6.2,<7",
  "shapely>=2.1,<3",
  "sqlalchemy[asyncio]>=2.0.41,<3",
  "structlog>=25.4,<26",
  "uvicorn[standard]>=0.35,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.4,<9",
  "pytest-asyncio>=1.1,<2",
  "pytest-cov>=6.2,<7",
  "ruff>=0.12,<1",
]

[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = []

[tool.pytest.ini_options]
addopts = "-q --strict-markers"
asyncio_default_test_loop_scope = "session"
testpaths = [
  "packages/backend_core/tests",
  "services/api/tests",
  "services/ingestion/tests",
]
pythonpath = [
  "packages/backend_core/src",
  "services/api/src",
  "services/ingestion/src",
]
markers = [
  "integration: requires the Docker PostgreSQL service",
]

[tool.ruff]
line-length = 100
target-version = "py313"
extend-exclude = ["packages/contracts/dart_client"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"packages/backend_core/migrations/versions/*.py" = ["E501"]
"services/api/src/ladepulse_api/main.py" = ["B008"]
