name: ladepulse-de

services:
  db:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.postgis
    image: ladepulse-postgis:17-3.5
    environment:
      POSTGRES_DB: ladepulse
      POSTGRES_USER: ladepulse
      POSTGRES_PASSWORD: ladepulse
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ladepulse -d ladepulse"]
      interval: 3s
      timeout: 3s
      retries: 20
    volumes:
      - postgres-data:/var/lib/postgresql/data

  redis:
    image: redis:7.4-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20
    volumes:
      - redis-data:/data

  minio:
    image: quay.io/minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-ladepulse-local}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-ladepulse-local-secret}
    ports:
      - "9000:9000"
      - "9001:9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 3s
      timeout: 3s
      retries: 20
    volumes:
      - minio-data:/data

  minio-init:
    image: quay.io/minio/mc:RELEASE.2025-04-16T18-13-26Z
    depends_on:
      minio:
        condition: service_healthy
    entrypoint:
      - /bin/sh
      - -c
      - >
        mc alias set local http://minio:9000
        ${S3_ACCESS_KEY:-ladepulse-local} ${S3_SECRET_KEY:-ladepulse-local-secret} &&
        mc mb --ignore-existing local/raw-payloads

  api:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile
    command: uvicorn ladepulse_api.main:app --host 0.0.0.0 --port 8000
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql+asyncpg://ladepulse:ladepulse@db:5432/ladepulse
      DATABASE_URL_SYNC: postgresql+psycopg://ladepulse:ladepulse@db:5432/ladepulse
      REDIS_URL: redis://redis:6379/0
      S3_ENDPOINT_URL: http://minio:9000
      API_BASE_URL: http://localhost:8000
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 5s
      timeout: 3s
      retries: 20

  ingestion:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile
    command: python -m ladepulse_ingestion.worker
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql+asyncpg://ladepulse:ladepulse@db:5432/ladepulse
      DATABASE_URL_SYNC: postgresql+psycopg://ladepulse:ladepulse@db:5432/ladepulse
      REDIS_URL: redis://redis:6379/0
      S3_ENDPOINT_URL: http://minio:9000
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy

volumes:
  postgres-data:
  redis-data:
  minio-data:
